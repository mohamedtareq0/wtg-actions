<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنفيذ...</title>
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbyd9xUSCZ848GrqjkM-zqhTVxKkIZAdyYW7iy46FmyJSlkOemQZK1ih4Qrn7dBLmL1E2w/exec?action=intizar">
<style>
  body{margin:0;font-family:sans-serif;background:#e9f1f6;color:#0d2f49;
    display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}
  .box{background:#fff;padding:30px 40px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .spin{width:40px;height:40px;border:3px solid #dff1f6;border-top-color:#0e7490;
    border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h2{margin:0 0 6px;font-size:18px}
  p{margin:0;color:#5f7686;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h2>جارٍ التنفيذ...</h2>
  <p>لحظات...</p>
</div>
<script>
  // احتياطي: لو meta refresh ما اشتغلش
  setTimeout(function(){
    window.location.href = "https://script.google.com/macros/s/AKfycbyd9xUSCZ848GrqjkM-zqhTVxKkIZAdyYW7iy46FmyJSlkOemQZK1ih4Qrn7dBLmL1E2w/exec?action=intizar";
  }, 100);
</script>
</body>
</html>
